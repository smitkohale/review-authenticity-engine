[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are inline CSS and HTML strings.
"fraudscope/ui/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
