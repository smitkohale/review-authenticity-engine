name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Tests cover the torch-free modules, so CI skips the heavy model stack.
      - run: pip install pandas==2.3.1 numpy==2.3.2 networkx==3.5 scikit-learn==1.9.0 pytest==8.3.3 ruff==0.6.9
      - run: ruff check .
      - run: pytest -q
