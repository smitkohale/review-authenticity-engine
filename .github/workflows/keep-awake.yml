# Streamlit Community Cloud puts an app to sleep after 12 hours without visitors, and a plain
# HTTP request does not count as a visit. This job opens the app in a headless browser every
# 6 hours and presses the wake-up button if the app is asleep.
# Note: GitHub disables scheduled workflows in repositories with no commits for 60 days.
name: keep-awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://review-trust-engine.streamlit.app/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Visit the app and wake it if asleep
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(5_000)
              button = page.get_by_role("button", name="get this app back up")
              if button.count():
                  print("App was asleep; waking it")
                  button.first.click()
                  page.wait_for_timeout(90_000)
              else:
                  print("App is awake")
                  page.wait_for_timeout(20_000)
              browser.close()
